name: 🚀 Развертывание (Self-hosted)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted  # ← Важно! Используем self-hosted runner
    
    steps:
    - name: 📥 Загрузить код
      uses: actions/checkout@v3
    
    - name: 🔄 Остановить старую версию
      run: |
        echo "🛑 Останавливаем предыдущее приложение..."
        pkill -f "python app.py" || echo "Нет запущенных процессов"
        sleep 2
    
    - name: 📦 Установить зависимости
      run: |
        echo "🔧 Проверяем виртуальное окружение..."
        cd /home/admin1/warehouse/Dashboard
        
        if [ ! -d "venv" ]; then
          echo "📦 Создаем новое venv..."
          python3 -m venv venv
        fi
        
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: ▶️ Запустить приложение
      run: |
        echo "🚀 Запускаем приложение..."
        cd /home/admin1/warehouse/Dashboard
        
        # Запускаем в screen для управления
        screen -dmS dashboard bash -c '
          source venv/bin/activate
          python app.py
        '
        
        echo "⏳ Ждем запуска..."
        sleep 5
        
        echo "🔍 Проверяем..."
        if curl -s http://localhost:8055 > /dev/null; then
          echo "✅ Приложение запущено!"
        else
          echo "❌ Ошибка запуска"
          exit 1
        fi
